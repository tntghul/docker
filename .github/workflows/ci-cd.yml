name: CI/CD Pipeline with Docker

# Yeh pipeline kab chalegi? Jab bhi 'main' branch par code push hoga
on:
  push:
    branches: [ main ]

jobs:
  # -----------------------------------------------------------------
  # JOB 1: Test & Verify (CI - Continuous Integration)
  # -----------------------------------------------------------------
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub runner par aapka code download karein
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js 20 install karein
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Backend check karein
      - name: Verify Backend
        run: |
          cd backend
          npm install

      # 4. Frontend check & build karein (syntax errors pakadne ke liye)
      - name: Verify & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

  # -----------------------------------------------------------------
  # JOB 2: Build & Push Docker Images to Docker Hub (CD)
  # -----------------------------------------------------------------
  build-and-push-docker:
    needs: test-and-verify # Pehle Job 1 pass hona chahiye, tabhi yeh chalega
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Docker Build engine setup karein
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub par login karein (GitHub Secrets ka use karke)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend Docker Image build aur push karein
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-backend:latest

      # Frontend Docker Image build aur push karein
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-frontend:latest